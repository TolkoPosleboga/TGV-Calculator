<div id="bim-view" class="view">
    <div class="view-header">
        <button class="btn-back" onclick="switchView('home')">← На главную</button>
        <h2>BIM-Проектирование</h2>
    </div>

    <div class="card" style="border-top: 3px solid var(--primary);">
        <p style="font-size: 14px; color: #475569; margin-bottom: 20px;">Загрузите 3D-модель здания (IFC). Программа автоматически найдет все помещения и сформирует проект.</p>

        <div style="background: #f8fafc; border: 1px dashed #cbd5e1; padding: 30px; border-radius: 6px; text-align: center; margin-bottom: 25px;">
            <input type="file" id="ifc-file-input" accept=".ifc" style="display: none;" onchange="document.getElementById('file-name-display').innerText = this.files[0].name">
            <label for="ifc-file-input" style="cursor: pointer; display: block;">
                <div style="font-size: 16px; margin-bottom: 10px; font-weight: 600; color: var(--primary);">Выберите файл .ifc</div>
                <div id="file-name-display" style="color: var(--muted); font-size: 13px;">Файл не выбран</div>
            </label>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label>Город строительства</label>
            <select id="bim_city" class="sync-city"></select>
            <input type="hidden" id="bim_gsop">
        </div>

        <button class="btn" onclick="uploadIFC()">Загрузить и рассчитать модель</button>

        <hr style="margin: 30px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3 style="font-size: 16px; margin-bottom: 15px; color: #475569; font-weight: 600;">Сохраненные BIM-проекты:</h3>
        <ul id="projects-list" style="list-style: none; padding: 0; max-height: 500px; overflow-y: auto;">
            <li>Загрузка данных...</li>
        </ul>

        <div class="card" id="project-details-area" style="display: none; margin-top: 20px; box-shadow: none; border: 1px solid #e2e8f0; padding: 20px; background: #fafafa;">
        </div>
    </div>
</div>
