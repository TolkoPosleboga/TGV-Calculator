<div class="tab-content" id="tab-gas">
    <div class="section-title" style="margin-top:15px;">Параметры дома и климат</div>
    <div class="form-grid">
        <div class="form-group">
            <label>t снаружи (°C)</label>
            <input type="number" id="g_t_out" readonly value="-32">
            <input type="hidden" id="g_gsop">
        </div>
        <div class="form-group"><label>Мощность котла (кВт)</label><input type="number" step="0.1" id="g_boiler_power" value="24"></div>

        <div class="form-group"><label>Длина (м)</label><input type="number" step="0.1" id="g_length" class="sync-length" value="6"></div>
        <div class="form-group"><label>Ширина (м)</label><input type="number" step="0.1" id="g_width" class="sync-width" value="4"></div>
        <div class="form-group"><label>Высота потолков (м)</label><input type="number" step="0.1" id="g_room_height" class="sync-height" value="3"></div>

        <div class="form-group">
            <label>Объем помещения (м³)</label>
            <input type="number" id="g_room_volume" readonly value="72">
        </div>
    </div>

    <div class="section-title">Газовое оборудование</div>
    <div class="form-grid">
        <div class="form-group checkbox"><input type="checkbox" id="g_has_stove" checked><label style="margin: 0; text-transform: none;">Газовая плита</label></div>
        <div class="form-group checkbox"><input type="checkbox" id="g_has_heater"><label style="margin: 0; text-transform: none;">Газовая колонка</label></div>
    </div>

    <div class="section-title">Дымоход и камера сгорания</div>
    <div class="form-grid">
        <div class="form-group"><label>Камера сгорания</label><select id="g_chamber"><option value="closed">Закрытая</option><option value="open">Открытая</option></select></div>
        <div class="form-group"><label>Высота дымохода (м)</label><input type="number" step="0.1" id="g_chimney_height" value="6"></div>
        <div class="form-group"><label>Площадь окна (м²)</label><input type="number" step="0.1" id="g_window_area" value="1.5"></div>
    </div>

    <div class="section-title">Гидравлика газопровода</div>
    <div class="form-grid">
        <div class="form-group"><label>Длина трубы (м)</label><input type="number" step="0.1" id="g_pipe_length" value="15"></div>
        <div class="form-group"><label>Сумма местных сопр. (Σζ)</label><input type="number" step="0.1" id="g_local_zeta" value="5.0"></div>
    </div>
    <button class="btn" onclick="calcGas()">РАССЧИТАТЬ ГАЗ</button>

    <div id="gas-results" style="display: none; margin-top: 25px;">
        <div id="g-alerts"></div>
        <div class="info-box" id="g-city-info" style="margin-bottom: 15px;"></div>
        <div class="results-dashboard" id="g-dashboard"></div>
        <details class="calc-details"><summary>🔍 Показать методику расчёта</summary><div id="g-methodology"></div></details>
        <details class="report-box"><summary>📄 Показать текстовый отчёт</summary><pre id="g-report"></pre></details>
        <div class="export-buttons">
            <button class="btn-export btn-excel" onclick="downloadFile('gas', 'excel')">📥 Скачать Excel</button>
            <button class="btn-export btn-pdf" onclick="downloadFile('gas', 'pdf')">📄 Скачать PDF</button>
        </div>
        <div class="card" id="g-safety-card" style="display: none; margin-top: 15px; padding: 15px;">
            <div class="section-title" style="color: #dc2626; border-color: #dc2626;">Комплект безопасности</div>
            <div id="g-safety-grid" class="solutions-grid"></div>
        </div>
    </div>
</div>
