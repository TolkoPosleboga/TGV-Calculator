<div class="tab-content" id="tab-heat">
    <div class="section-title" style="margin-top:15px;">Климат и габариты</div>
    <div class="form-grid">
        <div class="form-group"><label>Длина (м)</label><input type="number" step="0.1" id="h_length" class="sync-length" value="6"></div>
        <div class="form-group"><label>Ширина (м)</label><input type="number" step="0.1" id="h_width" class="sync-width" value="4"></div>
        <div class="form-group"><label>Высота (м)</label><input type="number" step="0.1" id="h_height" class="sync-height" value="3"></div>
        <div class="form-group">
            <label>t снаружи (°C)</label>
            <input type="number" id="h_t_out" readonly value="-32">
            <input type="hidden" id="h_gsop">
        </div>

        <div class="form-group">
            <label>Тип помещения</label>
            <select id="h_room_type" onchange="applyNormTemperature('h')">
                <option value="living">Жилая комната</option>
                <option value="office" selected>Офис / Административное</option>
                <option value="kitchen">Кухня</option>
                <option value="bathroom">Ванная / Санузел</option>
                <option value="corridor">Коридор</option>
                <option value="stairwell">Лестничная клетка</option>
                <option value="server_room">Серверная</option>
                <option value="smoking">Курилка</option>
                <option value="industrial_light">Производство (легкий труд)</option>
                <option value="industrial_heavy">Производство (тяжелый труд)</option>
                <option value="sport">Спортивный зал</option>
            </select>
        </div>
        <div class="form-group checkbox" style="margin-top: 0;">
            <input type="checkbox" id="h_is_corner" onchange="applyNormTemperature('h')">
            <label style="margin: 0; text-transform: none; color: #1e293b; font-weight: 600;">Угловое помещение (+2°C)</label>
        </div>
        <div class="form-group">
            <label>t внутри (°C)</label>
            <input type="number" id="h_t_in" value="22">
        </div>
    </div>

    <div class="section-title">Наружные стены</div>
    <div class="form-grid">
        <div class="form-group"><label>Площадь стен (м²)</label><input type="number" id="h_wall_area" value="40"></div>
        <div class="form-group"><label>Материал</label><select id="h_wall_mat"><option value="brick_hollow">Кирпич пустотелый</option><option value="brick_solid">Кирпич полнотелый</option><option value="aerated_d400">Газобетон D400</option><option value="aerated_d600">Газобетон D600</option><option value="wood">Брус</option></select></div>
        <div class="form-group"><label>Толщина стен (м)</label><input type="number" step="0.01" id="h_wall_thick" value="0.38"></div>
        <div class="form-group"><label>Утеплитель</label><select id="h_insul_mat"><option value="minwool">Минвата</option><option value="penoplex">Пеноплекс</option><option value="none">Без утеплителя</option></select></div>
        <div class="form-group"><label>Толщина утеплителя (м)</label><input type="number" step="0.01" id="h_insul_thick" value="0.1"></div>
    </div>

    <div class="section-title">Окна, крыша, пол</div>
    <div class="form-grid">
        <div class="form-group"><label>Площадь окон (м²)</label><input type="number" id="h_win_area" value="6"></div>
        <div class="form-group"><label>Тип окон</label><select id="h_win_type"><option value="double_chamber">Двухкамерный стеклопакет</option><option value="single_chamber">Однокамерный</option><option value="triple_chamber">Трехкамерный</option></select></div>
        <div class="form-group"><label>Площадь крыши (м²)</label><input type="number" id="h_roof_area" value="24"></div>
        <div class="form-group"><label>Утеплитель крыши (м)</label><input type="number" step="0.01" id="h_roof_insul" value="0.2"></div>
        <div class="form-group"><label>Площадь пола (м²)</label><input type="number" id="h_floor_area" value="24"></div>
    </div>

    <div class="section-title">Теплоноситель и гидравлика</div>
    <div class="form-grid">
        <div class="form-group"><label>Подача (°C)</label><input type="number" id="h_t_supply" value="90"></div>
        <div class="form-group"><label>Обратка (°C)</label><input type="number" id="h_t_return" value="70"></div>
        <div class="form-group"><label>Схема подключения</label><select id="h_connection_type"><option value="side">Боковое</option><option value="diagonal">Диагональное</option><option value="bottom">Нижнее</option></select></div>
        <div class="form-group"><label>Скорость воды (м/с)</label><input type="number" step="0.1" id="h_pipe_velocity" value="0.6"></div>
    </div>

    <div class="section-title">Тёплый пол (опционально)</div>
    <div class="form-grid">
        <div class="form-group"><label>Площадь пола (м²)</label><input type="number" id="h_uf_area" value="20"></div>
        <div class="form-group"><label>Шаг укладки трубы (мм)</label><select id="h_uf_spacing"><option value="100">100 мм</option><option value="150" selected>150 мм</option><option value="200">200 мм</option><option value="250">250 мм</option><option value="300">300 мм</option></select></div>
    </div>
    <button class="btn" onclick="calcHeat()">РАССЧИТАТЬ ТЕПЛОПОТЕРИ</button>

    <div id="heat-results" style="display: none; margin-top: 25px;">
        <div class="results-dashboard" id="h-dashboard"></div>
        <details class="calc-details"><summary>🔍 Показать методику расчёта</summary><div id="h-methodology"></div></details>
        <details class="report-box"><summary>📄 Показать текстовый отчёт</summary><pre id="h-report"></pre></details>
        <div class="export-buttons">
            <button class="btn-export btn-excel" onclick="downloadFile('heat', 'excel')">📥 Скачать Excel</button>
            <button class="btn-export btn-pdf" onclick="downloadFile('heat', 'pdf')">📄 Скачать PDF</button>
        </div>
        <div class="section-title" style="margin-top: 25px; display: flex; justify-content: space-between; align-items: center;">
            <span>Подбор оборудования</span>
            <div class="sort-container" style="margin:0;"><select id="h_sort" onchange="renderHeatCatalog()"><option value="price_asc">Дешевые</option><option value="price_desc">Дорогие</option><option value="brand">По бренду</option></select></div>
        </div>
        <div id="h-catalog"></div>
    </div>
</div>
