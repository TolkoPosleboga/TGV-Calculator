<div id="balance-view" class="view">
    <div class="view-header">
        <button class="btn-back" onclick="switchView('express')">← Назад к расчетам</button>
        <h2>Сводный воздушный баланс</h2>
    </div>

    <div class="card">
        <div class="section-title" style="margin-top:0;">Воздушный баланс здания</div>
        <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">
            Здесь собраны все помещения со всех этажей. Укажите приток и вытяжку, и калькулятор проверит общий баланс здания.
        </p>

        <div style="overflow-x: auto; margin-bottom: 20px;">
            <table style="width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border);">
                <thead>
                    <tr style="background: var(--bg-input); color: var(--text-muted); text-align: left;">
                        <th style="padding: 12px; width: 40px; text-align: center;">№</th>
                        <th style="padding: 12px;">Наименование помещения</th>
                        <th style="padding: 12px; width: 150px;">Приток (м³/ч)</th>
                        <th style="padding: 12px; width: 150px;">Вытяжка (м³/ч)</th>
                    </tr>
                </thead>
                <tbody id="balance-table-body"></tbody>
            </table>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
            <!-- Исправленная кнопка: теперь использует стандартный класс .btn (синий) -->
            <button class="btn" style="margin: 0; width: auto;" onclick="calcBalance()">
                Рассчитать баланс здания
            </button>

            <!-- Кнопка синхронизации сделана чуть другим оттенком синего для выделения -->
            <button class="btn" id="sync-balance-btn" style="margin: 0; width: auto; background: #0ea5e9; box-shadow: 0 2px 4px rgba(14, 165, 233, 0.2);" onclick="syncAllRoomBalances()">
                Синхронизировать со всеми расчетами
            </button>
        </div>

        <div id="balance-results" style="display: none; margin-top: 25px;">
            <div class="results-dashboard" id="balance-dashboard"></div>
        </div>
    </div>
</div>
