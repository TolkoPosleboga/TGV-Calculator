<div id="plan-view" class="view">
    <!-- ШАПКА ПРОЕКТА -->
    {% include 'partials/project_header.html' %}

    <div class="view-header">
        <button class="btn-back" onclick="switchView('express')">← Назад к расчетам</button>
        <h2>Планировка здания</h2>
    </div>

    <div style="display: flex; gap: 15px; height: calc(100vh - 200px); min-height: 500px;">
        <!-- ЛЕВАЯ ЧАСТЬ: Песочница -->
        <div style="flex: 1; display: flex; flex-direction: column; background: #fff; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <div class="toolbar" style="margin: 0; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 10px 15px; background: var(--bg-input);">
                <div class="toolbar-left" style="display: flex; gap: 10px;">
                    <button class="btn-toolbar" style="background: var(--accent); color: white; font-size: 13px;" onclick="addNewFloor()">+ Новый этаж</button>
                    <button class="btn-toolbar" style="background: var(--success); color: white; font-size: 13px;" onclick="createManualRoom()">+ Комната</button>
                    <button class="btn-toolbar" style="font-size: 13px;" onclick="clearCurrentFloor()">Очистить</button>
                </div>

                <div class="toolbar-right" style="display: flex; gap: 10px; align-items: center;">
                    <div style="width: 1px; height: 20px; background: var(--border); margin: 0 5px;"></div>
                    <button class="btn-toolbar" style="font-weight: bold; font-size: 14px;" onclick="zoomOut()">-</button>
                    <button class="btn-toolbar" style="font-weight: bold; font-size: 14px;" onclick="zoomIn()">+</button>
                </div>
            </div>

            <!-- СЕРАЯ ОБЛАСТЬ (КАНВАС) -->
            <div id="plan-canvas" style="position: relative; flex: 1; background: var(--bg-main); overflow: auto;">
                <div style="position: absolute; top: 15px; left: 15px; background: var(--bg-card); padding: 6px 12px; border-radius: 6px; font-weight: 600; color: var(--accent); z-index: 100; border: 1px solid var(--border); pointer-events: none;">
                    <span id="current-floor-name">1 этаж</span>
                </div>
                <div id="plan-inner" style="position: absolute; top: 50px; left: 50px; min-width: 100%; min-height: 100%;"></div>
            </div>

            <div id="floor-tabs" style="display: flex; gap: 10px; padding: 10px 15px; background: var(--bg-input); border-top: 1px solid var(--border); min-height: 50px;"></div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ: Инструменты и Список комнат -->
        <div style="width: 260px; display: flex; flex-direction: column; gap: 15px;">

            <!-- Инструменты (Сетка иконок) -->
            <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px;">
                <h3 style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; text-align: center;">Инструменты</h3>

                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                    <button class="tool-btn" id="tool-select" title="Выбор / Движение" style="padding: 10px; font-size: 18px; background: var(--accent-light); border: 1px solid var(--accent); border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center;" onclick="setTool('select')">🖱️</button>
                    <button class="tool-btn" id="tool-name" title="Автонумерация (по клику)" style="padding: 10px; font-size: 18px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center;" onclick="setTool('name')">🏷️</button>
                    <button class="tool-btn" id="tool-window" title="Окно" style="padding: 10px; font-size: 18px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center;" onclick="setTool('window')">🪟</button>
                    <button class="tool-btn" id="tool-door" title="Дверь" style="padding: 10px; font-size: 18px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center;" onclick="setTool('door')">🚪</button>
                    <button class="tool-btn" id="tool-passage" title="Проем (между комнатами)" style="padding: 10px; font-size: 18px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center;" onclick="setTool('passage')">📏</button>
                    <button class="tool-btn" id="tool-stairs" title="Лестница" style="padding: 10px; font-size: 18px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center;" onclick="setTool('stairs')">🪜</button>
                </div>
            </div>

            <!-- РАЗМЕРЫ АКТИВНОЙ КОМНАТЫ -->
            <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px;">
                <h3 style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; text-align: center;">Размеры комнаты</h3>
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label style="font-size: 10px; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 2px;">Ширина (м)</label>
                        <input type="number" id="dim_width" min="1" step="1" style="width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; text-align: center; background: var(--bg-input);" oninput="updateDimensionsFromInputs()">
                    </div>
                    <div style="flex: 1;">
                        <label style="font-size: 10px; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 2px;">Длина (м)</label>
                        <input type="number" id="dim_length" min="1" step="1" style="width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; text-align: center; background: var(--bg-input);" oninput="updateDimensionsFromInputs()">
                    </div>
                </div>
            </div>

            <!-- СВОЙСТВА ВЫБРАННОГО ЭЛЕМЕНТА -->
            <div id="element-props-panel" style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: none;">
                <h3 style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; text-align: center;">Свойства элемента</h3>
                <div id="element-props-content"></div>
            </div>

            <!-- Неустановленные комнаты -->
            <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column;">
                <h3 style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; text-align: center; flex-shrink: 0;">Неустановленные комнаты</h3>
                <div id="unplaced-rooms-list" style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1;"></div>
            </div>

        </div>
    </div>
</div>
