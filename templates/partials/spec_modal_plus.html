<div id="spec-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Сводная спецификация по объекту</h2>
            <button class="btn-close-modal" onclick="closeSpecModal()">✖</button>
        </div>
        <div class="modal-body">
            <p style="color: var(--text-muted); margin-bottom: 20px;">
                Нажмите «Синхронизировать», чтобы программа автоматически подобрала самое выгодное оборудование по всем помещениям на основе ваших вкладок.
            </p>

            <div id="spec-content" style="min-height: 200px;">
                <div class="warn-box" style="text-align:center; background: var(--bg-input); border-color: var(--border); color: var(--text-main);">
                    <b>Спецификация пуста.</b><br>
                    Нажмите кнопку «Синхронизировать расчеты» внизу.
                </div>
            </div>
        </div>
        <div class="modal-footer" style="flex-direction: column; align-items: stretch; gap: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="spec-total">
                    <span>Итого по объекту:</span>
                    <strong id="spec-total-price">0 ₽</strong>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-export btn-excel" style="width: auto; margin: 0;" onclick="downloadSpecExcel()">Скачать Excel</button>
                    <button class="btn btn-export btn-pdf" style="width: auto; margin: 0;" onclick="downloadSpecPDF()">Скачать PDF</button>
                    <button class="btn" style="width: auto; margin: 0; background: #0ea5e9;" onclick="syncSpecFromCalculations()" id="btn-sync-spec">Синхронизировать</button>
                    <button class="btn" style="width: auto; margin: 0; background: var(--text-muted);" onclick="closeSpecModal()">Закрыть</button>
                </div>
            </div>
        </div>
    </div>
</div>
